<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad7)"/>
  
  <!-- Camera frame -->
  <rect x="200" y="120" width="800" height="420" rx="16" fill="white" opacity="0.15" stroke="white" stroke-width="4"/>
  
  <!-- Face detection box 1 - with mask -->
  <rect x="350" y="200" width="180" height="240" rx="8" fill="none" stroke="#10b981" stroke-width="4" opacity="0.9"/>
  <rect x="350" y="440" width="180" height="40" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="440" y="467" font-family="monospace" font-size="18" fill="white" text-anchor="middle" font-weight="bold">✓ MASK ON</text>
  
  <!-- Simplified face with mask 1 -->
  <circle cx="440" cy="280" r="60" fill="white" opacity="0.3"/>
  <ellipse cx="420" cy="270" rx="8" ry="12" fill="white" opacity="0.6"/>
  <ellipse cx="460" cy="270" rx="8" ry="12" fill="white" opacity="0.6"/>
  <rect x="390" y="310" width="100" height="50" rx="8" fill="#10b981" opacity="0.8"/>
  
  <!-- Face detection box 2 - with mask -->
  <rect x="670" y="200" width="180" height="240" rx="8" fill="none" stroke="#10b981" stroke-width="4" opacity="0.9"/>
  <rect x="670" y="440" width="180" height="40" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="760" y="467" font-family="monospace" font-size="18" fill="white" text-anchor="middle" font-weight="bold">✓ MASK ON</text>
  
  <!-- Simplified face with mask 2 -->
  <circle cx="760" cy="280" r="60" fill="white" opacity="0.3"/>
  <ellipse cx="740" cy="270" rx="8" ry="12" fill="white" opacity="0.6"/>
  <ellipse cx="780" cy="270" rx="8" ry="12" fill="white" opacity="0.6"/>
  <rect x="710" y="310" width="100" height="50" rx="8" fill="#10b981" opacity="0.8"/>
  
  <!-- Recording indicator -->
  <circle cx="950" cy="150" r="12" fill="#ef4444"/>
  <text x="975" y="158" font-family="monospace" font-size="18" fill="white" font-weight="bold">REC</text>
  
  <!-- Title -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">
    Face Mask Detection
  </text>
</svg>
