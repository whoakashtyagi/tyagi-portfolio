<svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img">
  <title>Multi-Tenant License Manager — High-Level Architecture</title>
  <desc>Architecture diagram showing Admin Portal and Platform Services calling a License Manager microservice containing a License API, Privilege Resolver, and Audit Logger, backed by Redis cache and PostgreSQL.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0c1a26"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="190" cy="492" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="610" cy="492" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>

    <marker id="mBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388bfd"/>
    </marker>
    <marker id="mPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bc8cff"/>
    </marker>
    <marker id="mGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="mRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff7b72"/>
    </marker>
    <marker id="mYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e3b341"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <rect fill="url(#glowBlue)" width="800" height="560"/>
  <rect fill="url(#glowGreen)" width="800" height="560"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#topBar)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" letter-spacing="0.3">Multi-Tenant License Manager</text>
  <text x="400" y="50" text-anchor="middle" fill="#6e7681" font-size="11">High-Level Architecture · Java · Spring Boot · PostgreSQL · Redis</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 1: Callers -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Admin Portal -->
  <rect x="60" y="75" width="180" height="68" rx="8" fill="#0d1f3c" stroke="#388bfd" stroke-width="1.5"/>
  <text x="150" y="101" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="600">Admin Portal</text>
  <text x="150" y="120" text-anchor="middle" fill="#6e7681" font-size="10">Grant · Revoke · Extend licenses</text>
  <text x="150" y="134" text-anchor="middle" fill="#6e7681" font-size="10">REST calls to License API</text>

  <!-- Platform Services -->
  <rect x="560" y="75" width="180" height="68" rx="8" fill="#1a0f2e" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="650" y="101" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="600">Platform Services</text>
  <text x="650" y="120" text-anchor="middle" fill="#6e7681" font-size="10">Microservices (any language)</text>
  <text x="650" y="134" text-anchor="middle" fill="#6e7681" font-size="10">Per-request privilege checks</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 2: License Manager Service (big container) -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Outer dashed container -->
  <rect x="40" y="185" width="720" height="230" rx="12" fill="#0d1f38" fill-opacity="0.5" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="400" y="208" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700" letter-spacing="0.5">LICENSE MANAGER SERVICE  (Spring Boot · Docker)</text>

  <!-- Sub-box: License API -->
  <rect x="65" y="220" width="195" height="175" rx="8" fill="#0d1f3c" stroke="#388bfd" stroke-width="1"/>
  <rect x="65" y="220" width="195" height="28" rx="8" fill="#1a3a6e"/>
  <rect x="65" y="236" width="195" height="12" fill="#1a3a6e"/>
  <text x="162" y="239" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">License API</text>
  <text x="162" y="265" text-anchor="middle" fill="#8b949e" font-size="10">POST /licenses</text>
  <text x="162" y="281" text-anchor="middle" fill="#8b949e" font-size="10">DELETE /licenses/{id}</text>
  <text x="162" y="297" text-anchor="middle" fill="#8b949e" font-size="10">PATCH /licenses/{id}</text>
  <text x="162" y="313" text-anchor="middle" fill="#8b949e" font-size="10">GET /licenses?tenant_id=X</text>
  <line x1="80" y1="326" x2="245" y2="326" stroke="#21262d" stroke-width="1"/>
  <text x="162" y="345" text-anchor="middle" fill="#4d8fc9" font-size="10">→ Writes to PostgreSQL</text>
  <text x="162" y="362" text-anchor="middle" fill="#4d8fc9" font-size="10">→ Invalidates Redis cache</text>
  <text x="162" y="379" text-anchor="middle" fill="#4d8fc9" font-size="10">→ Appends audit log entry</text>

  <!-- Sub-box: Privilege Resolver -->
  <rect x="302" y="220" width="196" height="175" rx="8" fill="#0f2318" stroke="#3fb950" stroke-width="1"/>
  <rect x="302" y="220" width="196" height="28" rx="8" fill="#0f3020"/>
  <rect x="302" y="236" width="196" height="12" fill="#0f3020"/>
  <text x="400" y="239" text-anchor="middle" fill="#56d364" font-size="12" font-weight="700">Privilege Resolver</text>
  <text x="400" y="265" text-anchor="middle" fill="#8b949e" font-size="10">GET /can-access?tenant&amp;feature&amp;role</text>
  <text x="400" y="281" text-anchor="middle" fill="#8b949e" font-size="10">GET /tenant-features?tenant_id</text>
  <line x1="317" y1="294" x2="483" y2="294" stroke="#21262d" stroke-width="1"/>
  <text x="400" y="313" text-anchor="middle" fill="#3d8b54" font-size="10">① Check Redis cache (TTL 30s)</text>
  <text x="400" y="329" text-anchor="middle" fill="#3d8b54" font-size="10">② Cache miss → query PostgreSQL</text>
  <text x="400" y="345" text-anchor="middle" fill="#3d8b54" font-size="10">③ Resolve feature hierarchy</text>
  <text x="400" y="361" text-anchor="middle" fill="#3d8b54" font-size="10">④ Apply role-based rules</text>
  <text x="400" y="379" text-anchor="middle" fill="#3d8b54" font-size="10">↩ { "allowed": true/false }</text>

  <!-- Sub-box: Audit Logger -->
  <rect x="540" y="220" width="195" height="175" rx="8" fill="#1f1a0a" stroke="#e3b341" stroke-width="1"/>
  <rect x="540" y="220" width="195" height="28" rx="8" fill="#2e2206"/>
  <rect x="540" y="236" width="195" height="12" fill="#2e2206"/>
  <text x="637" y="239" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">Audit Logger</text>
  <text x="637" y="265" text-anchor="middle" fill="#8b949e" font-size="10">GET /audit-log?tenant_id=X</text>
  <text x="637" y="281" text-anchor="middle" fill="#8b949e" font-size="10">GET /usage-stats?feature=Y</text>
  <line x1="555" y1="294" x2="720" y2="294" stroke="#21262d" stroke-width="1"/>
  <text x="637" y="313" text-anchor="middle" fill="#b08830" font-size="10">All license changes recorded</text>
  <text x="637" y="329" text-anchor="middle" fill="#b08830" font-size="10">Enterprise compliance trail</text>
  <text x="637" y="345" text-anchor="middle" fill="#b08830" font-size="10">Feature adoption metrics</text>
  <text x="637" y="361" text-anchor="middle" fill="#b08830" font-size="10">Atomic quota enforcement</text>
  <text x="637" y="379" text-anchor="middle" fill="#b08830" font-size="10">Immutable append pattern</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 3: Data stores -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Redis -->
  <rect x="95" y="460" width="200" height="72" rx="8" fill="#200f0f" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="195" y="482" text-anchor="middle" fill="#ff7b72" font-size="13" font-weight="600">Redis Cache</text>
  <text x="195" y="499" text-anchor="middle" fill="#6e7681" font-size="10">Key: license:tenant:{id}:feature:{id}:role</text>
  <text x="195" y="514" text-anchor="middle" fill="#6e7681" font-size="10">TTL 30s · Invalidated on write</text>
  <text x="195" y="525" text-anchor="middle" fill="#6e7681" font-size="9">Sub-5ms privilege checks (99th pct)</text>

  <!-- PostgreSQL -->
  <rect x="505" y="460" width="200" height="72" rx="8" fill="#0a1f10" stroke="#3fb950" stroke-width="1.5"/>
  <text x="605" y="482" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="605" y="499" text-anchor="middle" fill="#6e7681" font-size="10">licenses · features · audit_log</text>
  <text x="605" y="514" text-anchor="middle" fill="#6e7681" font-size="10">Recursive CTEs · Atomic increments</text>
  <text x="605" y="525" text-anchor="middle" fill="#6e7681" font-size="9">Foreign keys · Transactions · Indexes</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Admin Portal → License API -->
  <path d="M150 143 L150 165 L162 165 L162 220" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#mBlue)"/>
  <rect x="60" y="155" width="74" height="17" rx="4" fill="#0d1117" fill-opacity="0.85"/>
  <text x="97" y="167" text-anchor="middle" fill="#388bfd" font-size="10">REST / HTTPS</text>

  <!-- Platform Services → Privilege Resolver -->
  <path d="M650 143 L650 165 L400 165 L400 220" fill="none" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#mPurple)"/>
  <rect x="486" y="155" width="90" height="17" rx="4" fill="#0d1117" fill-opacity="0.85"/>
  <text x="531" y="167" text-anchor="middle" fill="#bc8cff" font-size="10">GET /can-access</text>

  <!-- License API → Redis (invalidate) -->
  <path d="M162 395 L162 430 L195 430 L195 460" fill="none" stroke="#ff7b72" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#mRed)"/>
  <rect x="112" y="419" width="56" height="15" rx="3" fill="#0d1117" fill-opacity="0.85"/>
  <text x="140" y="430" text-anchor="middle" fill="#ff7b72" font-size="9">invalidate</text>

  <!-- Privilege Resolver → Redis (cache lookup) -->
  <path d="M340 395 L340 440 L195 440 L195 460" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#mRed)"/>
  <rect x="234" y="428" width="74" height="15" rx="3" fill="#0d1117" fill-opacity="0.85"/>
  <text x="271" y="440" text-anchor="middle" fill="#ff7b72" font-size="9">cache lookup</text>

  <!-- Privilege Resolver → PostgreSQL (cache miss) -->
  <path d="M460 395 L460 440 L605 440 L605 460" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#mGreen)"/>
  <rect x="473" y="428" width="63" height="15" rx="3" fill="#0d1117" fill-opacity="0.85"/>
  <text x="505" y="440" text-anchor="middle" fill="#3fb950" font-size="9">cache miss</text>

  <!-- License API → PostgreSQL (CRUD) -->
  <path d="M260 307 L560 307 C575 307 580 315 580 330 L580 430 L605 430 L605 460" fill="none" stroke="#3fb950" stroke-width="1.2" marker-end="url(#mGreen)"/>
  <rect x="390" y="298" width="56" height="14" rx="3" fill="#0d1117" fill-opacity="0.85"/>
  <text x="418" y="309" text-anchor="middle" fill="#3fb950" font-size="9">CRUD ops</text>

  <!-- Audit Logger → PostgreSQL -->
  <path d="M637 395 L637 450 L605 450 L605 460" fill="none" stroke="#e3b341" stroke-width="1.2" marker-end="url(#mYellow)"/>
  <rect x="615" y="413" width="50" height="14" rx="3" fill="#0d1117" fill-opacity="0.85"/>
  <text x="640" y="424" text-anchor="middle" fill="#e3b341" font-size="9">append log</text>

  <!-- Bottom label -->
  <text x="400" y="548" text-anchor="middle" fill="#3d444d" font-size="10">Zero-downtime vendor replacement · Employee of the Quarter delivery</text>
</svg>
