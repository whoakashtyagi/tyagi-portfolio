<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad6)"/>
  
  <!-- Central license server -->
  <rect x="475" y="200" width="250" height="180" rx="12" fill="#6366f1" opacity="0.9"/>
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">License</text>
  <text x="600" y="303" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">Manager</text>
  
  <!-- Key icon -->
  <circle cx="600" cy="340" r="20" fill="white" opacity="0.8"/>
  <rect x="615" y="332" width="30" height="16" fill="white" opacity="0.8"/>
  
  <!-- Tenant 1 -->
  <rect x="150" y="450" width="200" height="120" rx="8" fill="white" opacity="0.3"/>
  <text x="250" y="490" font-family="Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">Tenant A</text>
  <rect x="180" y="505" width="140" height="30" rx="4" fill="#10b981" opacity="0.7"/>
  <text x="250" y="527" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Licensed</text>
  
  <!-- Tenant 2 -->
  <rect x="420" y="450" width="200" height="120" rx="8" fill="white" opacity="0.3"/>
  <text x="520" y="490" font-family="Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">Tenant B</text>
  <rect x="450" y="505" width="140" height="30" rx="4" fill="#10b981" opacity="0.7"/>
  <text x="520" y="527" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Licensed</text>
  
  <!-- Tenant 3 -->
  <rect x="690" y="450" width="200" height="120" rx="8" fill="white" opacity="0.3"/>
  <text x="790" y="490" font-family="Arial, sans-serif" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">Tenant C</text>
  <rect x="720" y="505" width="140" height="30" rx="4" fill="#10b981" opacity="0.7"/>
  <text x="790" y="527" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Licensed</text>
  
  <!-- connection lines from license manager to tenants -->
  <line x1="550" y1="380" x2="250" y2="450" stroke="#6366f1" stroke-width="3" opacity="0.6"/>
  <line x1="600" y1="380" x2="520" y2="450" stroke="#6366f1" stroke-width="3" opacity="0.6"/>
  <line x1="650" y1="380" x2="790" y2="450" stroke="#6366f1" stroke-width="3" opacity="0.6"/>
  
  <!-- Title -->
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#333" text-anchor="middle">
    Multi-Tenant License Manager
  </text>
</svg>
