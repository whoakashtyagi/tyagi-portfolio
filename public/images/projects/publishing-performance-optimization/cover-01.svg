<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad3)"/>
  
  <!-- Performance chart - Before -->
  <rect x="150" y="350" width="80" height="200" rx="6" fill="white" opacity="0.4"/>
  <text x="190" y="580" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">Before</text>
  
  <!-- Performance chart - After -->
  <rect x="280" y="450" width="80" height="100" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="320" y="580" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">After</text>
  
  <!-- 3x improvement indicator -->
  <text x="450" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white">3×</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.9">Faster</text>
  
  <!-- Cache visualization -->
  <rect x="620" y="200" width="500" height="240" rx="12" fill="white" opacity="0.15"/>
  <text x="870" y="240" font-family="monospace" font-size="24" fill="white" text-anchor="middle" font-weight="bold">LRU Cache Layer</text>
  
  <!-- Cache blocks -->
  <rect x="660" y="270" width="100" height="60" rx="4" fill="#3b82f6" opacity="0.9"/>
  <rect x="780" y="270" width="100" height="60" rx="4" fill="#3b82f6" opacity="0.9"/>
  <rect x="900" y="270" width="100" height="60" rx="4" fill="#3b82f6" opacity="0.9"/>
  
  <rect x="660" y="350" width="100" height="60" rx="4" fill="#8b5cf6" opacity="0.9"/>
  <rect x="780" y="350" width="100" height="60" rx="4" fill="#8b5cf6" opacity="0.9"/>
  <rect x="900" y="350" width="100" height="60" rx="4" fill="#8b5cf6" opacity="0.9"/>
  
  <!-- Title -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">
    Performance Optimization
  </text>
</svg>
