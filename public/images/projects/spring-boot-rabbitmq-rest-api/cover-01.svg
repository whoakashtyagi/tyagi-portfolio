<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad4)"/>
  
  <!-- Producer service -->
  <rect x="150" y="200" width="250" height="230" rx="12" fill="white" opacity="0.2"/>
  <rect x="180" y="230" width="190" height="60" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="275" y="268" font-family="monospace" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Producer</text>
  
  <!-- API endpoint -->
  <rect x="180" y="310" width="190" height="40" rx="4" fill="white" opacity="0.3"/>
  <text x="275" y="337" font-family="monospace" font-size="14" fill="white" text-anchor="middle">POST /send</text>
  
  <!-- RabbitMQ in the middle -->
  <rect x="475" y="200" width="250" height="230" rx="12" fill="#ff6b35" opacity="0.3"/>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">RabbitMQ</text>
  <text x="600" y="320" font-family="monospace" font-size="18" fill="white" text-anchor="middle">Message Queue</text>
  
  <!-- Queue visualization -->
  <rect x="520" y="345" width="40" height="40" rx="4" fill="white" opacity="0.6"/>
  <rect x="570" y="345" width="40" height="40" rx="4" fill="white" opacity="0.6"/>
  <rect x="620" y="345" width="40" height="40" rx="4" fill="white" opacity="0.6"/>
  
  <!-- Consumer service -->
  <rect x="800" y="200" width="250" height="230" rx="12" fill="white" opacity="0.2"/>
  <rect x="830" y="230" width="190" height="60" rx="6" fill="#8b5cf6" opacity="0.9"/>
  <text x="925" y="268" font-family="monospace" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Consumer</text>
  
  <!-- Consumer action -->
  <rect x="830" y="310" width="190" height="40" rx="4" fill="white" opacity="0.3"/>
  <text x="925" y="337" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Process</text>
  
  <!-- Arrows -->
  <path d="M 410 315 L 465 315" stroke="white" stroke-width="4" opacity="0.7"/>
  <polygon points="465,315 455,310 455,320" fill="white" opacity="0.7"/>
  
  <path d="M 735 315 L 790 315" stroke="white" stroke-width="4" opacity="0.7"/>
  <polygon points="790,315 780,310 780,320" fill="white" opacity="0.7"/>
  
  <!-- Title -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">
    Spring Boot + RabbitMQ
  </text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">
    REST API Template
  </text>
</svg>
